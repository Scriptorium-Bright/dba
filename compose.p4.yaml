# P4 query/index workload stays on its own database, volume, and local ports.
services:
  db:
    image: postgres:17.12
    environment:
      POSTGRES_DB: rewardp4db
      POSTGRES_USER: reward_bootstrap
      POSTGRES_PASSWORD: ${P4_DB_BOOTSTRAP_PASSWORD:-p4_bootstrap_local_only}
      DB_APP_PASSWORD: ${P4_DB_APP_PASSWORD:-p4_app_local_only}
      DB_MIGRATION_PASSWORD: ${P4_DB_MIGRATION_PASSWORD:-p4_migration_local_only}
      DB_OBSERVER_PASSWORD: ${P4_DB_OBSERVER_PASSWORD:-p4_observer_local_only}
      TZ: UTC
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - reward_p4_pgdata:/var/lib/postgresql/data
      - ./database/bootstrap/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reward_bootstrap -d rewardp4db"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rewardp4db?currentSchema=reward&escapeSyntaxCallMode=callIfNoReturn
      SPRING_DATASOURCE_USERNAME: reward_app
      SPRING_DATASOURCE_PASSWORD: ${P4_DB_APP_PASSWORD:-p4_app_local_only}
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/rewardp4db?currentSchema=reward
      SPRING_FLYWAY_USER: reward_migration
      SPRING_FLYWAY_PASSWORD: ${P4_DB_MIGRATION_PASSWORD:-p4_migration_local_only}
      # Concurrent index builds run in a P4-only Flyway location outside a transaction.
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/p4-migration
      SPRING_FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK: "false"
      # P4 measures the P3 admin payout query over a large ledger fixture.
      # P4도 별도 DB이므로 같은 승인된 migration 버전으로 올린다.
      SPRING_FLYWAY_TARGET: ${P4_FLYWAY_TARGET:-16}
      APP_ALLOWED_ORIGIN: http://127.0.0.1:5176
      APP_DEMO_WALLET_RESET_ENABLED: ${APP_DEMO_WALLET_RESET_ENABLED:-true}
      APP_P3_COMPENSATION_ENABLED: "true"
    ports:
      - "127.0.0.1:8282:8080"

volumes:
  reward_p4_pgdata:
    name: reward_p4_pgdata
