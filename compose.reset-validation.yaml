# Disposable PostgreSQL/API stack used only for the all-user reset acceptance run.
services:
  db:
    image: postgres:17.12
    environment:
      POSTGRES_DB: rewardresetdb
      POSTGRES_USER: reward_bootstrap
      POSTGRES_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:-local_bootstrap_only}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-local_app_only}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-local_migration_only}
      DB_OBSERVER_PASSWORD: ${DB_OBSERVER_PASSWORD:-local_observer_only}
      TZ: UTC
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - reward_reset_validation_pgdata:/var/lib/postgresql/data
      - ./database/bootstrap/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reward_bootstrap -d rewardresetdb"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rewardresetdb?currentSchema=reward&escapeSyntaxCallMode=callIfNoReturn
      SPRING_DATASOURCE_USERNAME: reward_app
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:-local_app_only}
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/rewardresetdb?currentSchema=reward
      SPRING_FLYWAY_USER: reward_migration
      SPRING_FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:-local_migration_only}
      APP_ALLOWED_ORIGIN: http://127.0.0.1:8383
      APP_DEMO_WALLET_RESET_ENABLED: "true"
      APP_P3_COMPENSATION_ENABLED: "true"
    ports:
      - "127.0.0.1:8383:8080"

volumes:
  reward_reset_validation_pgdata:
    name: reward_reset_validation_pgdata
