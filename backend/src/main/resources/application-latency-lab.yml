# Expose diagnostic metrics and constrain the pool only in the isolated local lab.
spring:
  datasource:
    hikari:
      pool-name: RewardLatencyLabPool
      maximum-pool-size: 4
      minimum-idle: 4
      # A 100-client burst can demonstrate acquisition-timeout behavior in this lab.
      connection-timeout: 1500

server:
  tomcat:
    threads:
      # Let 100 lab clients reach the four-connection Hikari pool at once.
      max: 128

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  latency-lab:
    enabled: true
