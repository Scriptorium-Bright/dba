# P3 전용 PostgreSQL. 프로젝트명과 볼륨을 P2 Compose와 분리해 사용한다.
services:
  db:
    image: postgres:17.12
    environment:
      POSTGRES_DB: rewardp3db
      POSTGRES_USER: reward_bootstrap
      POSTGRES_PASSWORD: ${P3_DB_BOOTSTRAP_PASSWORD:-p3_bootstrap_local_only}
      DB_APP_PASSWORD: ${P3_DB_APP_PASSWORD:-p3_app_local_only}
      DB_MIGRATION_PASSWORD: ${P3_DB_MIGRATION_PASSWORD:-p3_migration_local_only}
      DB_OBSERVER_PASSWORD: ${P3_DB_OBSERVER_PASSWORD:-p3_observer_local_only}
      TZ: UTC
    ports:
      # 5432는 P2 서비스가 사용하므로 격리 실습은 55432로 공개한다.
      - "127.0.0.1:55432:5432"
    volumes:
      - reward_p3_pgdata:/var/lib/postgresql/data
      - ./database/bootstrap/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reward_bootstrap -d rewardp3db"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rewardp3db?currentSchema=reward&escapeSyntaxCallMode=callIfNoReturn
      SPRING_DATASOURCE_USERNAME: reward_app
      SPRING_DATASOURCE_PASSWORD: ${P3_DB_APP_PASSWORD:-p3_app_local_only}
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/rewardp3db?currentSchema=reward
      SPRING_FLYWAY_USER: reward_migration
      SPRING_FLYWAY_PASSWORD: ${P3_DB_MIGRATION_PASSWORD:-p3_migration_local_only}
      # 현재 끝 migration 번호를 사용한다. Flyway는 없는 target(예: 99)을 거부한다.
      SPRING_FLYWAY_TARGET: ${P3_FLYWAY_TARGET:-11}
      APP_ALLOWED_ORIGIN: http://127.0.0.1:5175
      # P3 is local-only and loopback-bound; keep the requested wallet reset UI available for practice.
      APP_DEMO_WALLET_RESET_ENABLED: ${APP_DEMO_WALLET_RESET_ENABLED:-true}
      APP_P3_COMPENSATION_ENABLED: ${APP_P3_COMPENSATION_ENABLED:-false}
    ports:
      # P2 API 8082의 데이터 경로와 포트를 공유하지 않는다.
      - "127.0.0.1:8182:8080"

volumes:
  # 고유 이름을 명시해 dbapj_reward_pgdata를 잘못 재사용하지 않게 한다.
  reward_p3_pgdata:
    name: reward_p3_pgdata
